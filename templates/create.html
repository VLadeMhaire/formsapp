<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    input, select, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
    .question { border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    button { padding: 10px 16px; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; background: #f4f4f4; border-radius: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Create a form</h1>
  <input id="title" placeholder="Form title">
  <textarea id="description" placeholder="Description (optional)"></textarea>

  <div id="questions"></div>
  <button type="button" onclick="addQuestion()">+ Add question</button>
  <br><br>
  <button type="button" onclick="createForm()">Create form</button>

  <div id="result" style="display:none;"></div>

<script>
let qCount = 0;

function addQuestion() {
  qCount++;
  const div = document.createElement('div');
  div.className = 'question';
  div.id = `q-${qCount}`;
  div.innerHTML = `
    <input placeholder="Question label" class="q-label">
    <select class="q-type">
      <option value="text">Short answer</option>
      <option value="textarea">Paragraph</option>
      <option value="radio">Multiple choice</option>
      <option value="checkbox">Checkboxes</option>
    </select>
    <input placeholder="Options (comma-separated, for multiple choice/checkboxes)" class="q-options">
    <label><input type="checkbox" class="q-required"> Required</label>
  `;
  document.getElementById('questions').appendChild(div);
}
addQuestion();

async function createForm() {
  const questions = [...document.querySelectorAll('.question')].map(q => ({
    label: q.querySelector('.q-label').value,
    field_type: q.querySelector('.q-type').value,
    options: q.querySelector('.q-options').value,
    required: q.querySelector('.q-required').checked,
  }));

  const res = await fetch('/api/forms', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: document.getElementById('title').value,
      description: document.getElementById('description').value,
      questions,
    }),
  });
  const data = await res.json();
  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = `Shareable link: <a href="${data.share_url}" target="_blank">${window.location.origin}${data.share_url}</a>
    <br>Results link: <a href="${data.share_url}/results" target="_blank">${window.location.origin}${data.share_url}/results</a>`;
}
</script>
</body>
</html>
