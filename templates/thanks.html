<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for your response</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--gray-100,#F3F4F6)}
  body{
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(circle at 15% 8%, rgba(14,165,199,.28), transparent 48%),
      radial-gradient(circle at 90% 90%, rgba(15,23,42,.4), transparent 48%),
      linear-gradient(160deg, #071a30 0%, #0d3a68 45%, #0f6fa8 100%);
  }
  .card{
    background:#fff;border-radius:20px;box-shadow:0 20px 25px rgba(0,0,0,.1),0 10px 10px rgba(0,0,0,.04);
    padding:44px 36px;text-align:center;max-width:420px;width:100%;
  }
  .check{
    width:64px;height:64px;border-radius:50%;background:#DCFCE7;color:#166534;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 20px;
  }
  h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;color:#111827;margin-bottom:8px;letter-spacing:-.01em}
  p{color:#6B7280;font-size:.9rem;line-height:1.55}
</style>
</head>
<body>
  <div class="card">
    <div class="check"><i class="fas fa-check"></i></div>
    <h1>Thanks for your response!</h1>
    <p>Your answer has been recorded successfully.</p>
  </div>
</body>
</html>
